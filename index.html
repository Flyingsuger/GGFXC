<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="light-content">
    <title>广告法复习 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #007AFF;
            --primary-dark: #0051D5;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg-primary: #F2F2F7;
            --bg-secondary: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #3C3C43;
            --text-tertiary: #8E8E93;
            --separator: rgba(60, 60, 67, 0.12);
            --card-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 主容器 */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
        }

        /* 顶部导航 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: max(env(safe-area-inset-top), 12px) 20px 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 0.5px solid var(--separator);
            box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.03);
        }

        .navbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .navbar-btn {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: none;
            background: var(--bg-primary);
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar-btn:active {
            transform: scale(0.9);
            background: var(--separator);
        }

        /* 进度卡片 */
        .progress-card {
            margin: 16px 20px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.25);
            color: white;
            animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-title {
            font-size: 15px;
            font-weight: 600;
            opacity: 0.9;
        }

        .progress-percentage {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .progress-stats {
            display: flex;
            gap: 20px;
            margin-top: 16px;
        }

        .stat-item {
            flex: 1;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .progress-bar-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-bar-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        /* 分类选择 */
        .category-section {
            padding: 20px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .category-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-card:hover::before {
            transform: scaleX(1);
        }

        .category-card.all {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .category-icon {
            margin-bottom: 12px;
        }

        .category-icon svg {
            width: 32px;
            height: 32px;
            display: block;
        }

        .category-card.all .category-icon svg {
            stroke: white;
        }

        .category-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: left;
        }

        .category-count {
            font-size: 13px;
            opacity: 0.6;
            text-align: left;
        }

        /* 学习页面 */
        .study-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 2000;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .study-page.active {
            display: block;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(100%);
            }
        }

        .study-page.closing {
            animation: slideOutRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .study-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: max(env(safe-area-inset-top), 12px) 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--separator);
        }

        .back-btn {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: none;
            background: var(--bg-primary);
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .study-title {
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 12px;
            border: none;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* 题目卡片 */
        .card-wrapper {
            padding: 20px;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-card {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            width: 100%;
            animation: cardFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-progress-mini {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--separator);
        }

        .card-category-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .card-stats {
            display: flex;
            gap: 12px;
            font-size: 13px;
        }

        .stat-correct {
            color: var(--success);
            font-weight: 600;
        }

        .stat-correct::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 4px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2334C759" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>') no-repeat center;
            background-size: contain;
            vertical-align: middle;
        }

        .stat-wrong {
            color: var(--danger);
            font-weight: 600;
        }

        .stat-wrong::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 4px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23FF3B30" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>') no-repeat center;
            background-size: contain;
            vertical-align: middle;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        .blank {
            display: inline-block;
            border-bottom: 2px solid var(--primary);
            padding: 0 8px;
            min-width: 80px;
            cursor: pointer;
            color: transparent;
            user-select: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 600;
        }

        .blank::after {
            content: '?';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary);
            font-size: 16px;
            opacity: 0.5;
        }

        .blank.revealed {
            color: var(--primary);
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.1), rgba(0, 122, 255, 0.05));
            border-radius: 8px;
            padding: 4px 12px;
            animation: revealPop 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blank.revealed::after {
            display: none;
        }

        @keyframes revealPop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 翻卡牌模式 */
        .flip-card-container {
            perspective: 1000px;
            min-height: 250px;
            margin: 24px 0;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 250px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card-container.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-face {
            position: absolute;
            width: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 250px;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        .flip-hint {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .flip-icon {
            animation: tap 1.5s infinite;
        }

        @keyframes tap {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* 选择题选项 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .option {
            padding: 16px 20px;
            background: var(--bg-primary);
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .option:active::before {
            width: 200%;
            height: 200%;
        }

        .option.selected {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.05);
            transform: translateX(4px);
        }

        .option.correct {
            border-color: var(--success);
            background: rgba(52, 199, 89, 0.1);
            animation: successPulse 0.5s;
        }

        .option.wrong {
            border-color: var(--danger);
            background: rgba(255, 59, 48, 0.1);
            animation: shake 0.5s;
        }

        @keyframes successPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* 动作按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:active::before {
            width: 300%;
            height: 300%;
        }

        .btn-wrong {
            background: linear-gradient(135deg, var(--danger), #FF6B66);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 59, 48, 0.3);
        }

        .btn-wrong:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.2);
        }

        .btn-correct {
            background: linear-gradient(135deg, var(--success), #5CD67F);
            color: white;
            box-shadow: 0 4px 16px rgba(52, 199, 89, 0.3);
        }

        .btn-correct:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.2);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: 12px 20px max(env(safe-area-inset-bottom), 12px);
            display: flex;
            gap: 12px;
            border-top: 0.5px solid var(--separator);
            box-shadow: 0 -1px 0 0 rgba(0, 0, 0, 0.03);
        }

        .nav-button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--bg-primary);
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-button:not(:disabled):active {
            transform: scale(0.95);
        }

        .nav-button.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px max(env(safe-area-inset-bottom), 24px);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3000;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.12);
        }

        .settings-panel.active {
            transform: translateY(0);
        }

        .settings-handle {
            width: 36px;
            height: 5px;
            background: var(--separator);
            border-radius: 3px;
            margin: 0 auto 20px;
        }

        .settings-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--separator);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 16px;
            font-weight: 500;
        }

        .settings-button {
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-button:active {
            transform: scale(0.95);
        }

        /* 遮罩层 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2999;
            animation: fadeIn 0.3s;
        }

        .overlay.active {
            display: block;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid var(--separator);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 响应式 */
        @media (min-width: 768px) {
            .category-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 首页 -->
        <div id="homePage">
            <!-- 导航栏 -->
            <div class="navbar">
                <div class="navbar-content">
                    <div class="navbar-title">广告法复习</div>
                    <button class="navbar-btn" onclick="toggleSettings()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 进度卡片 -->
            <div class="progress-card">
                <div class="progress-header">
                    <div class="progress-title">学习进度</div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
                <div class="progress-stats">
                    <div class="stat-item">
                        <div class="stat-label">总计</div>
                        <div class="stat-value" id="totalCount">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">掌握</div>
                        <div class="stat-value" id="masteredCount">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">薄弱</div>
                        <div class="stat-value" id="weakCount">0</div>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <!-- 分类选择 -->
            <div class="category-section">
                <div class="section-title">选择法规分类</div>
                <div class="category-grid" id="categoryGrid"></div>
            </div>
        </div>

        <!-- 学习页面 -->
        <div class="study-page" id="studyPage">
            <div class="study-header">
                <button class="back-btn" onclick="closStudy()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>

            { cat: '四类广告审查', q: '不得使用"安全""____""毒副作用小"等表述。', a: '安全无毒副作用', opts: ['安全无毒副作用', '副作用可控', '不良反应少', '使用安全'] },
            { cat: '四类广告审查', q: '不得含"热销、抢购、试用""____、免费治疗、免费赠送"等诱导性内容。', a: '家庭必备', opts: ['家庭必备', '医生推荐', '患者首选', '市场领先'] },
            { cat: '四类广告审查', q: '不得含"____、保险公司保险"等保证性内容。', a: '无效退款', opts: ['无效退款', '质量保证', '效果承诺', '假一赔十'] },
            { cat: '四类广告审查', q: '四类广告均须显著标明广告____。', a: '批准文号', opts: ['批准文号', '注册证号', '备案编号', '许可证号'] },
            { cat: '四类广告审查', q: '保健食品广告必须显著标明"保健食品不是药物，不能代替____治疗疾病"。', a: '药物', opts: ['药物', '医疗', '医生', '医院'] },
            { cat: '四类广告审查', q: '特殊医学用途配方食品必须显著标明"请在____或临床营养师指导下使用"。', a: '医生', opts: ['医生', '药师', '营养师', '护士'] },
        ];

        // SVG图标定义
        const ICONS = {
            all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>',
            law: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>',
            internet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
            charity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
            agriculture: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
            veterinary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4h2v2h-2zM9 7h6v2H9zM7 10h10v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9z"/><path d="M10 16h4"/></svg>',
            medical: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l-4 4 6 6 4-16-18 7 4 2 2 6 3-4z"/></svg>',
            regulation: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></svg>',
            realestate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
            medical4: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 9v6M9 12h6M7 3h10M7 21h10"/></svg>'
        };

        // 分类定义
        const CATEGORIES = [
            { id: 'all', name: '全部法规', icon: 'all', desc: '随机全部题目' },
            { id: '广告法', name: '广告法', icon: 'law', desc: '核心基础法规' },
            { id: '互联网广告', name: '互联网广告', icon: 'internet', desc: '网络广告规范' },
            { id: '公益广告', name: '公益广告', icon: 'charity', desc: '公益广告管理' },
            { id: '农药广告', name: '农药广告', icon: 'agriculture', desc: '农药广告审查' },
            { id: '兽药广告', name: '兽药广告', icon: 'veterinary', desc: '兽药广告规定' },
            { id: '医疗广告', name: '医疗广告', icon: 'medical', desc: '医疗广告管理' },
            { id: '广告管理条例', name: '广告管理条例', icon: 'regulation', desc: '广告管理规定' },
            { id: '房地产广告', name: '房地产广告', icon: 'realestate', desc: '房地产广告规定' },
            { id: '四类广告审查', name: '四类广告审查', icon: 'medical4', desc: '药品医疗器械等' },
        ];

        // 应用状态
        const state = {
            mode: 'self',
            currentCategory: 'all',
            currentIndex: 0,
            currentQuestions: [],
            records: {},
            showingStudy: false
        };

        // 初始化
        function init() {
            loadData();
            renderCategories();
            updateProgress();
            setupModeToggle();
        }

        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('adLawProData');
            if (saved) {
                Object.assign(state, JSON.parse(saved));
            }
            // 确保每个题目都有记录
            QUESTIONS.forEach((q, i) => {
                if (!state.records[i]) {
                    state.records[i] = { correct: 0, wrong: 0, lastTime: 0 };
                }
            });
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('adLawProData', JSON.stringify(state));
        }

        // 渲染分类卡片
        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = CATEGORIES.map(cat => {
                const count = cat.id === 'all' ? QUESTIONS.length : QUESTIONS.filter(q => q.cat === cat.id).length;
                const cardClass = cat.id === 'all' ? 'category-card all' : 'category-card';
                return `
                    <div class="${cardClass}" onclick="openCategory('${cat.id}')">
                        <div class="category-icon">${ICONS[cat.icon]}</div>
                        <div class="category-name">${cat.name}</div>
                        <div class="category-count">${count}题 · ${cat.desc}</div>
                    </div>
                `;
            }).join('');
        }

        // 打开分类学习
        function openCategory(categoryId) {
            state.currentCategory = categoryId;

            // 获取该分类的题目并随机排序
            if (categoryId === 'all') {
                state.currentQuestions = [...Array(QUESTIONS.length).keys()];
            } else {
                state.currentQuestions = QUESTIONS
                    .map((q, i) => ({ q, i }))
                    .filter(item => item.q.cat === categoryId)
                    .map(item => item.i);
            }

            // 随机排序
            shuffleArray(state.currentQuestions);
            state.currentIndex = 0;

            // 显示学习页面
            document.getElementById('studyPage').classList.add('active');
            document.getElementById('studyPageTitle').textContent =
                CATEGORIES.find(c => c.id === categoryId)?.name || '学习';

            renderQuestion();
            updateNavButtons();
        }

        // 数组随机排序
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 关闭学习页面
        function closStudy() {
            const page = document.getElementById('studyPage');
            page.classList.add('closing');
            setTimeout(() => {
                page.classList.remove('active', 'closing');
            }, 400);
            updateProgress();
        }

        // 模式切换
        function setupModeToggle() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.mode = btn.dataset.mode;
                    saveData();
                    renderQuestion();
                });
            });
        }

        // 渲染题目
        function renderQuestion() {
            if (state.currentQuestions.length === 0) {
                document.getElementById('cardContainer').innerHTML = '<div class="loading">没有题目</div>';
                return;
            }

            const qIndex = state.currentQuestions[state.currentIndex];
            const q = QUESTIONS[qIndex];
            const record = state.records[qIndex];

            const container = document.getElementById('cardContainer');

            if (state.mode === 'self') {
                // 自评模式
                container.innerHTML = `
                    <div class="question-card">
                        <div class="card-progress-mini">
                            <span class="card-category-badge">${q.cat}</span>
                            <div class="card-stats">
                                <span class="stat-correct">${record.correct}</span>
                                <span class="stat-wrong">${record.wrong}</span>
                            </div>
                        </div>
                        <div class="question-text" id="questionText"></div>
                        <div class="action-buttons">
                            <button class="action-btn btn-wrong" onclick="handleAnswer(false)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20" style="display:inline-block;vertical-align:middle;margin-right:6px">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M15 9l-6 6M9 9l6 6"/>
                                </svg>
                                不记得
                            </button>
                            <button class="action-btn btn-correct" onclick="handleAnswer(true)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20" style="display:inline-block;vertical-align:middle;margin-right:6px">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M9 12l2 2 4-4"/>
                                </svg>
                                记得
                            </button>
                        </div>
                    </div>
                `;

                // 渲染带填空的文本
                setTimeout(() => {
                    const textEl = document.getElementById('questionText');
                    textEl.innerHTML = q.q.replace(/____/g, `<span class="blank">${q.a}</span>`);

                    // 绑定点击显示
                    document.querySelectorAll('.blank').forEach(blank => {
                        blank.addEventListener('click', () => {
                            blank.classList.toggle('revealed');
                        });
                    });
                }, 0);

            } else if (state.mode === 'flip') {
                // 翻卡牌模式
                container.innerHTML = `
                    <div class="question-card">
                        <div class="card-progress-mini">
                            <span class="card-category-badge">${q.cat}</span>
                            <div class="card-stats">
                                <span class="stat-correct">${record.correct}</span>
                                <span class="stat-wrong">${record.wrong}</span>
                            </div>
                        </div>
                        <div class="flip-card-container" id="flipCard" onclick="this.classList.toggle('flipped')">
                            <div class="flip-card-inner">
                                <div class="flip-card-face flip-card-front">
                                    <div class="question-text">${q.q}</div>
                                    <div class="flip-hint">
                                        <svg class="flip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="display:inline-block;vertical-align:middle">
                                            <path d="M9 18l6-6-6-6"/>
                                        </svg>
                                        <span>点击翻转查看答案</span>
                                    </div>
                                </div>
                                <div class="flip-card-face flip-card-back">
                                    <div style="font-size: 15px; color: var(--text-secondary); margin-bottom: 12px;">问题：</div>
                                    <div style="font-size: 16px; line-height: 1.6; margin-bottom: 24px;">${q.q.replace(/____/g, '<span style="color: var(--primary); font-weight: 600;">' + q.a + '</span>')}</div>
                                    <div style="font-size: 15px; color: var(--text-secondary); margin-bottom: 12px;">答案：</div>
                                    <div style="font-size: 22px; font-weight: 700; color: var(--primary);">${q.a}</div>
                                </div>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button class="action-btn btn-wrong" onclick="handleAnswer(false)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20" style="display:inline-block;vertical-align:middle;margin-right:6px">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M15 9l-6 6M9 9l6 6"/>
                                </svg>
                                不记得
                            </button>
                            <button class="action-btn btn-correct" onclick="handleAnswer(true)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20" style="display:inline-block;vertical-align:middle;margin-right:6px">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M9 12l2 2 4-4"/>
                                </svg>
                                记得
                            </button>
                        </div>
                    </div>
                `;

            } else if (state.mode === 'choice') {
                // 选择题模式
                container.innerHTML = `
                    <div class="question-card">
                        <div class="card-progress-mini">
                            <span class="card-category-badge">${q.cat}</span>
                            <div class="card-stats">
                                <span class="stat-correct">${record.correct}</span>
                                <span class="stat-wrong">${record.wrong}</span>
                            </div>
                        </div>
                        <div class="question-text">${q.q}</div>
                        <div class="options-container">
                            ${q.opts.map(opt => `
                                <div class="option" onclick="selectOption(this, '${opt}', '${q.a}')">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // 处理答题
        function handleAnswer(isCorrect) {
            const qIndex = state.currentQuestions[state.currentIndex];
            const record = state.records[qIndex];

            if (isCorrect) {
                record.correct++;
            } else {
                record.wrong++;
            }
            record.lastTime = Date.now();

            saveData();
            updateProgress();

            // 自动下一题
            setTimeout(() => {
                goNext();
            }, 300);
        }

        // 选择题选项处理
        function selectOption(element, selected, correct) {
            if (element.classList.contains('correct') || element.classList.contains('wrong')) {
                return;
            }

            const qIndex = state.currentQuestions[state.currentIndex];
            const record = state.records[qIndex];

            const isCorrect = selected === correct;

            if (isCorrect) {
                element.classList.add('correct');
                record.correct++;
            } else {
                element.classList.add('wrong');
                record.wrong++;

                // 标记正确答案
                document.querySelectorAll('.option').forEach(opt => {
                    if (opt.textContent.trim() === correct) {
                        opt.classList.add('correct');
                    }
                });
            }

            record.lastTime = Date.now();
            saveData();
            updateProgress();

            // 自动下一题
            setTimeout(() => {
                goNext();
            }, 1500);
        }

        // 导航功能
        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = state.currentIndex === 0;
            nextBtn.disabled = state.currentIndex >= state.currentQuestions.length - 1;
        }

        function goPrev() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
                updateNavButtons();
            }
        }

        function goNext() {
            if (state.currentIndex < state.currentQuestions.length - 1) {
                state.currentIndex++;
                renderQuestion();
                updateNavButtons();
            }
        }

        // 更新进度
        function updateProgress() {
            const total = QUESTIONS.length;
            let mastered = 0;
            let weak = 0;

            QUESTIONS.forEach((q, i) => {
                const record = state.records[i];
                if (record.correct >= 3 && record.wrong === 0) {
                    mastered++;
                } else if (record.wrong > record.correct || record.wrong >= 2) {
                    weak++;
                }
            });

            const percentage = Math.round((mastered / total) * 100);

            document.getElementById('totalCount').textContent = total;
            document.getElementById('masteredCount').textContent = mastered;
            document.getElementById('weakCount').textContent = weak;
            document.getElementById('progressPercentage').textContent = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        // 设置面板
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('overlay');

            panel.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function randomizeQuestions() {
            if (state.currentQuestions.length > 0) {
                shuffleArray(state.currentQuestions);
                state.currentIndex = 0;
                renderQuestion();
                updateNavButtons();
            }
            toggleSettings();
        }

        function resetProgress() {
            if (confirm('确定要重置所有学习进度吗？此操作不可恢复。')) {
                state.records = {};
                QUESTIONS.forEach((q, i) => {
                    state.records[i] = { correct: 0, wrong: 0, lastTime: 0 };
                });
                saveData();
                updateProgress();
                if (state.currentQuestions.length > 0) {
                    renderQuestion();
                }
                toggleSettings();
                alert('进度已重置！');
            }
        }

        function exportData() {
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `广告法复习数据_${new Date().toLocaleDateString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toggleSettings();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            Object.assign(state, data);
                            saveData();
                            updateProgress();
                            if (state.currentQuestions.length > 0) {
                                renderQuestion();
                            }
                            toggleSettings();
                            alert('导入成功！');
                        } catch (error) {
                            alert('导入失败：文件格式错误');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        // 启动应用
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
